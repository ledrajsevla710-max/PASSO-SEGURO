<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Seguro - Acesso ao Sistema</title>
    <!-- 1. CDN Oficial do Supabase V2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Arquivo de Configuração -->
    <script src="js/config.js"></script>
    <style>
        :root {
            --azul-governo: #004080;
            --azul-escuro: #002244;
            --azul-claro: #e8f0fe;
            --verde-sucesso: #137333;
            --cinza-fundo: #f0f4f8;
            --cinza-borda: #cbd5e1;
            --texto-principal: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid var(--cinza-borda);
            border-radius: 12px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h1 {
            color: var(--azul-governo);
            margin: 0;
            font-size: 22px;
        }

        .login-header p {
            color: #64748b;
            font-size: 13px;
            margin: 5px 0 0 0;
        }

        .perfil-selector {
            display: flex;
            background-color: #e2e8f0;
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .perfil-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            color: #475569;
            transition: all 0.2s;
        }

        .perfil-btn.ativo {
            background-color: #ffffff;
            color: var(--azul-governo);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }

        .form-control {
            width: 100%;
            padding: 11px 12px;
            box-sizing: border-box;
            border: 1.5px solid var(--cinza-borda);
            border-radius: 6px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: var(--azul-governo);
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 64, 128, 0.15);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--azul-governo);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--azul-escuro);
        }

        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        .form-footer a {
            color: var(--azul-governo);
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <h1>Passo Seguro</h1>
            <p>Secretaria de Estado da Saúde - Piauí</p>
        </div>

        <!-- ABAS DE SELEÇÃO DE PERFIL -->
        <div class="perfil-selector">
            <button type="button" id="btn-tab-paciente" class="perfil-btn ativo" onclick="alternarPerfil('paciente')">👤 Paciente</button>
            <button type="button" id="btn-tab-profissional" class="perfil-btn" onclick="alternarPerfil('profissional')">🩺 Profissional</button>
        </div>

        <!-- FORMULÁRIO -->
        <form id="form-login">
            <!-- CAMPOS EXTRAS DE CADASTRO (Aparecem apenas se for Profissional E estiver no modo Cadastro) -->
            <div id="campos-cadastro-profissional" style="display: none;">
                <div class="form-group">
                    <label for="nome-profissional">Nome Completo do Profissional:</label>
                    <input type="text" id="nome-profissional" class="form-control" placeholder="Ex: Dr(a). Nome Sobrenome">
                </div>
                <div class="form-group">
                    <label for="coren-profissional">Nº do COREN-PI / Conselho:</label>
                    <input type="text" id="coren-profissional" class="form-control" placeholder="Ex: COREN-PI 000.000">
                </div>
            </div>

            <div class="form-group">
                <label for="email-input">E-mail Institucional ou Pessoal:</label>
                <input type="email" id="email-input" class="form-control" placeholder="seu.email@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha-input">Senha de Acesso:</label>
                <input type="password" id="senha-input" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-acao-submit" class="btn-submit">Entrar como Paciente</button>
        </form>

        <div class="form-footer">
            <p id="texto-alternancia">Não tem uma conta? <a href="#" id="link-modo-cadastro" onclick="toggleModo(event)">Cadastre-se aqui</a></p>
        </div>
    </div>

    <script>
        let modoAtual = "login"; // 'login' ou 'cadastro'
        let perfilAtual = "paciente"; // 'paciente' ou 'profissional'

        function atualizarInterface() {
            const btnPaciente = document.getElementById("btn-tab-paciente");
            const btnProfissional = document.getElementById("btn-tab-profissional");
            const divCadastroProf = document.getElementById("campos-cadastro-profissional");
            const btnSubmit = document.getElementById("btn-acao-submit");
            const linkModo = document.getElementById("link-modo-cadastro");

            if (perfilAtual === "paciente") {
                btnPaciente.classList.add("ativo");
                btnProfissional.classList.remove("ativo");
                divCadastroProf.style.display = "none";

                if (modoAtual === "login") {
                    btnSubmit.textContent = "Entrar como Paciente";
                    linkModo.innerHTML = "Cadastre-se aqui";
                } else {
                    btnSubmit.textContent = "Criar Conta de Paciente";
                    linkModo.innerHTML = "Já tem uma conta? Faça login";
                }
            } else {
                btnProfissional.classList.add("ativo");
                btnPaciente.classList.remove("ativo");

                // O COREN e Nome aparecem APENAS se for Profissional E estiver no modo Cadastro
                if (modoAtual === "cadastro") {
                    divCadastroProf.style.display = "block";
                    btnSubmit.textContent = "Cadastrar Profissional (Estomaterapeuta)";
                    linkModo.innerHTML = "Já tem uma conta? Faça login";
                } else {
                    divCadastroProf.style.display = "none";
                    btnSubmit.textContent = "Entrar como Profissional";
                    linkModo.innerHTML = "Cadastre-se aqui";
                }
            }
        }

        function alternarPerfil(perfil) {
            perfilAtual = perfil;
            atualizarInterface();
        }

        function toggleModo(e) {
            e.preventDefault();
            modoAtual = (modoAtual === "login") ? "cadastro" : "login";
            atualizarInterface();
        }

        // Lógica de Autenticação Segura com Supabase V2
        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email-input").value;
            const senha = document.getElementById("senha-input").value;
            const nomeProfissional = document.getElementById("nome-profissional")?.value || "";
            const corenProfissional = document.getElementById("coren-profissional")?.value || "";

            const clienteSupabase = window.supabase || supabase;

            if (!clienteSupabase) {
                alert("Erro: Cliente Supabase não carregado. Verifique o arquivo config.js.");
                return;
            }

            try {
                if (modoAtual === "cadastro") {
                    // 1. Cria a conta no Auth do Supabase
                    const { data: authData, error: authError } = await clienteSupabase.auth.signUp({ email, senha });
                    if (authError) throw authError;

                    const userId = authData.user?.id;

                    // 2. Salva o perfil na tabela (Profissional nasce com aprovado: false)
                    if (userId) {
                        const isProfissional = (perfilAtual === 'profissional');
                        const { error: dbError } = await clienteSupabase.from('perfis_usuarios').insert([
                            { 
                                id: userId, 
                                email: email, 
                                tipo_perfil: perfilAtual,
                                nome: isProfissional ? nomeProfissional : 'Paciente',
                                coren: isProfissional ? corenProfissional : null,
                                aprovado: !isProfissional // Pacientes aprovados direto; profissionais exigem moderação
                            }
                        ]);
                        if (dbError) console.warn("Aviso ao salvar perfil complementar:", dbError.message);
                    }

                    if (perfilAtual === 'profissional') {
                        alert("Cadastro realizado com sucesso! Sua conta de profissional está pendente de aprovação pela coordenação da SESAPI/HGV.");
                        window.location.href = "login.html";
                    } else {
                        alert("Cadastro de paciente realizado com sucesso!");
                        window.location.href = "dashboard.html";
                    }

                } else {
                    // 1. Faz o login utilizando apenas e-mail e senha
                    const { data: authData, error: authError } = await clienteSupabase.auth.signInWithPassword({ email, senha });
                    if (authError) throw authError;

                    const userId = authData.user?.id;

                    // 2. Consulta o perfil e o status de aprovação no banco
                    const { data: perfilData, error: perfilError } = await clienteSupabase
                        .from('perfis_usuarios')
                        .select('tipo_perfil, aprovado')
                        .eq('id', userId)
                        .single();

                    const tipoBanco = perfilData ? perfilData.tipo_perfil : perfilAtual;
                    const estaAprovado = perfilData ? perfilData.aprovado : true;

                    if (tipoBanco === 'profissional') {
                        if (!estaAprovado) {
                            alert("Acesso restrito: Sua conta de profissional ainda não foi aprovada pela coordenação da SESAPI/HGV.");
                            await clienteSupabase.auth.signOut(); // Desloga o usuário
                            return;
                        }
                        alert("Login de profissional efetuado com sucesso!");
                        window.location.href = "profissional.html";
                    } else {
                        alert("Login de paciente efetuado com sucesso!");
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (err) {
                alert("Erro na autenticação: " + err.message);
            }
        });
    </script>
</body>
</html>
