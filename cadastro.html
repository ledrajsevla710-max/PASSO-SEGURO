
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta – Passo Seguro</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header-app">
    <div>
        <h1>👣 Passo Seguro</h1>
        <p class="subtitulo">Criar conta</p>
    </div>

    <nav>
        <a href="login.html" class="btn btn-secundario"
           style="background:#fff;color:#003366;border-color:#fff;">
            Já tenho conta
        </a>
    </nav>
</header>

<main>
    <div class="container" style="max-width:560px;">

        <section class="card">

            <h2 class="card-titulo texto-centro">
                Criar sua conta
            </h2>

            <p class="texto-centro" style="color:#555;margin-bottom:20px;">
                Cadastro para acompanhamento e autocuidado dos pés.
            </p>

            <div id="mensagem" class="escondido" role="alert"></div>

            <form id="form-cadastro" novalidate>

                <h3>Dados de acesso</h3>

                <div class="form-grupo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome"
                           required autocomplete="name">
                </div>

                <div class="form-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                           required autocomplete="email">
                </div>

                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                           minlength="6" required autocomplete="new-password">
                </div>

                <div class="form-grupo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha"
                           name="confirmar-senha" required minlength="6">
                </div>

                <h3>Dados pessoais</h3>

                <div class="form-grupo">
                    <label for="data-nascimento">Data de nascimento</label>
                    <input type="date" id="data-nascimento"
                           name="data-nascimento">
                </div>

                <div class="form-grupo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone"
                           autocomplete="tel" placeholder="(00) 00000-0000">
                </div>

                <div class="form-grupo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade">
                </div>

                <div class="form-grupo">
                    <label for="uf">Estado (UF)</label>
                    <input type="text" id="uf" name="uf"
                           maxlength="2" placeholder="Ex.: PA">
                </div>

                <div class="form-grupo">
                    <label for="cartao-sus">Cartão SUS (opcional)</label>
                    <input type="text" id="cartao-sus" name="cartao-sus"
                           placeholder="Número do Cartão Nacional de Saúde">
                </div>

                <h3>Informações para acompanhamento</h3>

                <div class="form-grupo">
                    <label>Possui diabetes?</label>

                    <div class="form-check">
                        <input type="radio" id="diabetes-sim"
                               name="possui_diabetes" value="sim">
                        <label for="diabetes-sim">Sim</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" id="diabetes-nao"
                               name="possui_diabetes" value="nao" checked>
                        <label for="diabetes-nao">Não</label>
                    </div>
                </div>

                <div class="form-grupo">
                    <label>Já teve úlcera nos pés?</label>

                    <div class="form-check">
                        <input type="radio" id="ulcera-sim"
                               name="historico_ulcera" value="sim" checked>
                        <label for="ulcera-sim">Sim</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" id="ulcera-nao"
                               name="historico_ulcera" value="nao">
                        <label for="ulcera-nao">Não</label>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="data-cicatrizacao">
                        Data aproximada da última cicatrização
                    </label>
                    <input type="date" id="data-cicatrizacao"
                           name="data-cicatrizacao">
                </div>

                <div class="form-grupo">
                    <label>Possui amputação em algum dos pés?</label>

                    <div class="form-check">
                        <input type="radio" id="amputacao-nao"
                               name="amputacao" value="nao" checked>
                        <label for="amputacao-nao">Não</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" id="amputacao-sim"
                               name="amputacao" value="sim">
                        <label for="amputacao-sim">Sim</label>
                    </div>
                </div>

                <div class="form-grupo" id="grupo-local-amputacao" hidden>
                    <label for="local-amputacao">Local da amputação</label>
                    <input type="text" id="local-amputacao"
                           name="local-amputacao">
                </div>

                <div class="form-grupo">
                    <label>Tem alguém que pode ajudar na inspeção dos pés?</label>

                    <div class="form-check">
                        <input type="radio" id="cuidador-sim"
                               name="tem_cuidador" value="sim">
                        <label for="cuidador-sim">Sim</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" id="cuidador-nao"
                               name="tem_cuidador" value="nao" checked>
                        <label for="cuidador-nao">Não</label>
                    </div>
                </div>

                <div class="form-check" style="margin:20px 0;">
                    <input type="checkbox" id="aceite"
                           name="aceite" required>

                    <label for="aceite">
                        Entendo que o Passo Seguro é uma ferramenta de
                        apoio ao autocuidado e
                        <strong>não substitui</strong> a avaliação de
                        um profissional de saúde.
                    </label>
                </div>

                <button type="submit"
                        class="btn btn-primario btn-bloco"
                        id="btn-cadastrar">
                    Criar conta
                </button>

            </form>

            <p class="texto-centro mt-2">
                Já tem conta?
                <a href="login.html"><strong>Entrar</strong></a>
            </p>

        </section>

        <div class="aviso-clinico">
            Os dados informados serão utilizados para o acompanhamento
            no contexto do Passo Seguro.
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const radios = document.querySelectorAll(
        'input[name="amputacao"]'
    );

    const grupo = document.getElementById(
        "grupo-local-amputacao"
    );

    const campo = document.getElementById("local-amputacao");

    function atualizarLocalAmputacao() {

        const selecionado = document.querySelector(
            'input[name="amputacao"]:checked'
        );

        const mostrar = selecionado?.value === "sim";

        grupo.hidden = !mostrar;
        campo.required = mostrar;

        if (!mostrar) {
            campo.value = "";
        }
    }

    radios.forEach(function (radio) {
        radio.addEventListener("change", atualizarLocalAmputacao);
    });

    atualizarLocalAmputacao();

});
</script>

</body>
</html>
