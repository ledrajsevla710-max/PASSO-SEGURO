<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Seguro - Acesso ao Sistema</title>
    <!-- CDN do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    
    <style>
        :root {
            --azul-governo: #004080;
            --azul-escuro: #002244;
            --azul-claro: #e8f0fe;
            --verde-sucesso: #137333;
            --verde-hover: #0d5223;
            --cinza-fundo: #f0f4f8;
            --cinza-borda: #cbd5e1;
            --texto-principal: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid var(--cinza-borda);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h1 {
            color: var(--azul-governo);
            font-size: 24px;
            margin: 0 0 6px 0;
        }

        .login-header p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }

        .tabs-container {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 1.5px solid var(--azul-governo);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background-color: #ffffff;
            color: var(--azul-governo);
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.ativo {
            background-color: var(--azul-governo);
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid var(--cinza-borda);
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-acao {
            width: 100%;
            background-color: var(--verde-sucesso);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-acao:hover { background-color: var(--verde-hover); }

        .modo-toggle {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #475569;
        }

        .modo-toggle a {
            color: var(--azul-governo);
            text-decoration: none;
            font-weight: bold;
        }
        .modo-toggle a:hover { text-decoration: underline; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Passo Seguro</h1>
            <p>SESAPI / Hospital Getúlio Vargas - HGV</p>
        </div>

        <!-- ABAS DE SELEÇÃO DO PERFIL -->
        <div class="tabs-container">
            <button type="button" class="tab-btn ativo" id="tab-paciente" onclick="alternarPerfil('paciente')">Paciente</button>
            <button type="button" class="tab-btn" id="tab-profissional" onclick="alternarPerfil('profissional')">Profissional / HGV</button>
        </div>

        <form id="form-auth">
            <!-- Campos específicos para Paciente (visíveis apenas no cadastro de paciente) -->
            <div id="campos-paciente" class="hidden">
                <div class="form-group">
                    <label for="nome-paciente">Nome Completo:</label>
                    <input type="text" id="nome-paciente" class="form-control" placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="cartao-sus">Nº do Cartão SUS:</label>
                    <input type="text" id="cartao-sus" class="form-control" placeholder="Ex: 123 4567 8901 2345">
                </div>
            </div>

            <!-- Campos específicos para Profissionais (visíveis apenas no cadastro de profissional) -->
            <div id="campos-profissional" class="hidden">
                <div class="form-group">
                    <label for="nome-profissional">Nome Completo:</label>
                    <input type="text" id="nome-profissional" class="form-control" placeholder="Ex: Dr. Carlos Eduardo">
                </div>
                <div class="form-group">
                    <label for="coren-profissional">Nº do COREN:</label>
                    <input type="text" id="coren-profissional" class="form-control" placeholder="Ex: COREN-PI 123456">
                </div>
            </div>

            <div class="form-group">
                <label for="email-input">E-mail de Acesso:</label>
                <input type="email" id="email-input" class="form-control" required placeholder="seu.email@exemplo.com">
            </div>

            <div class="form-group">
                <label for="senha-input">Senha:</label>
                <input type="password" id="senha-input" class="form-control" required placeholder="********">
            </div>

            <button type="submit" id="btn-submit" class="btn-acao">Entrar</button>
        </form>

        <div class="modo-toggle">
            <span id="texto-alternancia">Não tem cadastro? <a href="#" id="link-alternar-modo">Cadastre-se como Paciente</a></span>
        </div>
    </div>

    <script>
        let perfilAtual = 'paciente'; // 'paciente' ou 'profissional'
        let modoAtual = 'login'; // 'login' ou 'cadastro'

        function alternarPerfil(perfil) {
            perfilAtual = perfil;
            if (perfil === 'paciente') {
                document.getElementById('tab-paciente').classList.add('ativo');
                document.getElementById('tab-profissional').classList.remove('ativo');
            } else {
                document.getElementById('tab-profissional').classList.add('ativo');
                document.getElementById('tab-paciente').classList.remove('ativo');
            }
            atualizarVisibilidadeCampos();
            atualizarTextoAlternancia();
        }

        const linkAlternar = document.getElementById('link-alternar-modo');
        linkAlternar.addEventListener('click', (e) => {
            e.preventDefault();
            modoAtual = (modoAtual === 'login') ? 'cadastro' : 'login';
            
            if (modoAtual === 'cadastro') {
                document.getElementById('btn-submit').textContent = 'Cadastrar';
            } else {
                document.getElementById('btn-submit').textContent = 'Entrar';
            }
            atualizarVisibilidadeCampos();
            atualizarTextoAlternancia();
        });

        function atualizarVisibilidadeCampos() {
            const divPaciente = document.getElementById('campos-paciente');
            const divProfissional = document.getElementById('campos-profissional');

            if (modoAtual === 'cadastro') {
                if (perfilAtual === 'paciente') {
                    divPaciente.classList.remove('hidden');
                    divProfissional.classList.add('hidden');
                } else {
                    divPaciente.classList.add('hidden');
                    divProfissional.classList.remove('hidden');
                }
            } else {
                divPaciente.classList.add('hidden');
                divProfissional.classList.add('hidden');
            }
        }

        function atualizarTextoAlternancia() {
            const textoAlternanciaDiv = document.getElementById('texto-alternancia');
            if (modoAtual === 'cadastro') {
                textoAlternanciaDiv.innerHTML = 'Já tem cadastro? <a href="#" id="link-alternar-modo" onclick="alternarModoManual(event)">Faça login</a>';
            } else {
                let nomePerfil = perfilAtual === 'paciente' ? 'Paciente' : 'Profissional';
                textoAlternanciaDiv.innerHTML = `Não tem cadastro? <a href="#" id="link-alternar-modo" onclick="alternarModoManual(event)">Cadastre-se como ${nomePerfil}</a>`;
            }
        }

        function alternarModoManual(e) {
            e.preventDefault();
            modoAtual = (modoAtual === 'login') ? 'cadastro' : 'login';
            document.getElementById('btn-submit').textContent = (modoAtual === 'cadastro') ? 'Cadastrar' : 'Entrar';
            atualizarVisibilidadeCampos();
            atualizarTextoAlternancia();
        }

        // Lógica Principal de Autenticação e Cadastro com o Supabase
        document.getElementById("form-auth").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (typeof window.supabase === 'undefined') {
                alert("Erro: Cliente Supabase não inicializado.");
                return;
            }

            const email = document.getElementById("email-input").value.trim();
            const senha = document.getElementById("senha-input").value;
            
            const nomePaciente = document.getElementById("nome-paciente")?.value.trim() || '';
            const cartaoSus = document.getElementById("cartao-sus")?.value.trim() || '';
            
            const nomeProfissional = document.getElementById("nome-profissional")?.value.trim() || '';
            const corenProfissional = document.getElementById("coren-profissional")?.value.trim() || '';

            try {
                if (modoAtual === "cadastro") {
                    if (perfilAtual === 'profissional' && (!nomeProfissional || !corenProfissional)) {
                        alert("Por favor, preencha o Nome Completo e o COREN para o cadastro profissional.");
                        return;
                    }
                    if (perfilAtual === 'paciente' && (!nomePaciente || !cartaoSus)) {
                        alert("Por favor, preencha o Nome Completo e o Cartão SUS.");
                        return;
                    }

                    // 1. Cria a conta no Auth do Supabase
                    const { data: authData, error: authError } = await window.supabase.auth.signUp({
                        email,
                        senha
                    });

                    if (authError) throw authError;

                    const userId = authData.user?.id;

                    // 2. Salva o perfil na tabela perfis_usuarios
                    if (userId) {
                        const isProfissional = (perfilAtual === 'profissional');
                        const { error: dbError } = await window.supabase.from('perfis_usuarios').insert([
                            {
                                id: userId,
                                email: email,
                                tipo: perfilAtual,
                                nome_completo: isProfissional ? nomeProfissional : nomePaciente,
                                coren: isProfissional ? corenProfissional : null,
                                cartao_sus: !isProfissional ? cartaoSus : null,
                                aprovado: !isProfissional // Pacientes aprovados direto; profissionais nascem com false
                            }
                        ]);

                        if (dbError) throw dbError;
                    }

                    if (perfilAtual === 'profissional') {
                        alert("Cadastro realizado com sucesso! Sua conta de profissional está pendente de aprovação pela moderação da SESAPI/HGV.");
                    } else {
                        alert("Cadastro de paciente realizado com sucesso!");
                        window.location.href = "dashboard.html";
                    }

                    modoAtual = 'login';
                    document.getElementById('btn-submit').textContent = 'Entrar';
                    atualizarVisibilidadeCampos();
                    atualizarTextoAlternancia();
                    document.getElementById('form-auth').reset();

                } else {
                    // 1. Efetua o login
                    const { data: authData, error: authError } = await window.supabase.auth.signInWithPassword({
                        email,
                        senha
                    });

                    if (authError) throw authError;

                    const userId = authData.user?.id;

                    // 2. Consulta o perfil e o status de aprovação no banco
                    const { data: perfilData, error: perfilError } = await window.supabase
                        .from('perfis_usuarios')
                        .select('tipo, aprovado')
                        .eq('id', userId)
                        .single();

                    if (perfilError || !perfilData) {
                        throw new Error("Perfil de usuário não encontrado no banco de dados.");
                    }

                    if (perfilData.tipo === 'profissional') {
                        if (!perfilData.aprovado) {
                            alert("Acesso restrito: Sua conta profissional ainda não foi aprovada pela moderação.");
                            await window.supabase.auth.signOut();
                            return;
                        }
                        alert("Login de profissional efetuado com sucesso!");
                        window.location.href = "profissional.html";
                    } else {
                        alert("Login efetuado com sucesso!");
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (err) {
                alert("Erro na autenticação: " + err.message);
                console.error("Erro:", err);
            }
        });
    </script>
</body>
</html>
