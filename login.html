<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Seguro - Autenticação</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 1º: Biblioteca Oficial do Supabase (Carregada obrigatoriamente primeiro) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2º: Arquivo de Configuração e Chaves -->
    <script src="js/config.js"></script>

    <!-- 3º: Lógica do Formulário (defer garante o carregamento após o HTML) -->
    <script src="js/login.js" defer></script>
</head>
<body>
    <header class="header-app">
        <div class="logo-container">
            <h1>Passo Seguro</h1>
            <p>Acesso ao Sistema de Autocuidado</p>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="btn-secundario">Voltar ao Início</a>
        </nav>
    </header>

    <main class="dashboard-container" style="max-width: 450px; margin: 40px auto;">
        <section class="card-modulo">
            <!-- ABAS DE NAVEGAÇÃO ENTRE LOGIN E CADASTRO -->
            <div style="display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px;">
                <button id="tab-login" type="button" style="flex: 1; padding: 12px; border: none; background: none; font-weight: bold; border-bottom: 3px solid #007bff; color: #007bff; cursor: pointer;">Entrar</button>
                <button id="tab-cadastro" type="button" style="flex: 1; padding: 12px; border: none; background: none; font-weight: bold; color: #666; cursor: pointer;">Cadastrar</button>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="form-login">
                <div class="form-group">
                    <label for="email-login">E-mail:</label>
                    <input type="email" id="email-login" class="form-control" placeholder="seu@email.com" required>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="senha-login">Senha:</label>
                    <input type="password" id="senha-login" class="form-control" placeholder="********" required>
                </div>
                <button type="submit" class="btn-primario" style="width: 100%; margin-top: 20px; padding: 12px;">Entrar no Sistema</button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form id="form-cadastro" style="display: none;">
                <div class="form-group">
                    <label for="nome-cadastro">Nome Completo:</label>
                    <input type="text" id="nome-cadastro" class="form-control" placeholder="Digite seu nome completo" required>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="email-cadastro">E-mail:</label>
                    <input type="email" id="email-cadastro" class="form-control" placeholder="seu@email.com" required>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="senha-cadastro">Senha:</label>
                    <input type="password" id="senha-cadastro" class="form-control" placeholder="Crie uma senha" required>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="tipo-usuario">Tipo de Perfil:</label>
                    <select id="tipo-usuario" class="form-control" required>
                        <option value="paciente">Pessoa com úlcera cicatrizada (Paciente)</option>
                        <option value="profissional">Profissional de Saúde (Enfermagem / Estomaterapia)</option>
                        <option value="cuidador">Cuidador Autorizado</option>
                    </select>
                </div>
                <button type="submit" class="btn-primario" style="width: 100%; margin-top: 20px; padding: 12px;">Criar Conta Segura</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Passo Seguro - Projeto de Pesquisa Aplicado à Saúde. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Alternância entre as abas de Login e Cadastro
        document.addEventListener("DOMContentLoaded", () => {
            const tabLogin = document.getElementById("tab-login");
            const tabCadastro = document.getElementById("tab-cadastro");
            const formLogin = document.getElementById("form-login");
            const formCadastro = document.getElementById("form-cadastro");

            if (tabLogin && tabCadastro && formLogin && formCadastro) {
                tabLogin.addEventListener("click", () => {
                    formLogin.style.display = "block";
                    formCadastro.style.display = "none";
                    tabLogin.style.borderBottom = "3px solid #007bff";
                    tabLogin.style.color = "#007bff";
                    tabCadastro.style.borderBottom = "none";
                    tabCadastro.style.color = "#666";
                });

                tabCadastro.addEventListener("click", () => {
                    formLogin.style.display = "none";
                    formCadastro.style.display = "block";
                    tabCadastro.style.borderBottom = "3px solid #007bff";
                    tabCadastro.style.color = "#007bff";
                    tabLogin.style.borderBottom = "none";
                    tabLogin.style.color = "#666";
                });
            }
        });
    </script>
</body>
</html>
