<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo Seguro - Acesso ao Sistema</title>
    <!-- CDN do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    
    <style>
        :root {
            --azul-governo: #004080;
            --azul-escuro: #002244;
            --azul-claro: #e8f0fe;
            --verde-sucesso: #137333;
            --verde-hover: #0d5223;
            --cinza-fundo: #f0f4f8;
            --cinza-borda: #cbd5e1;
            --texto-principal: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cinza-fundo);
            color: var(--texto-principal);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid var(--cinza-borda);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h1 {
            color: var(--azul-governo);
            font-size: 24px;
            margin: 0 0 6px 0;
        }

        .login-header p {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }

        /* Seletor de Abas (Paciente / Profissional) */
        .tabs-container {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            border: 1.5px solid var(--azul-governo);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background-color: #ffffff;
            color: var(--azul-governo);
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.ativo {
            background-color: var(--azul-governo);
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1.5px solid var(--cinza-borda);
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-acao {
            width: 100%;
            background-color: var(--verde-sucesso);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-acao:hover { background-color: var(--verde-hover); }

        .modo-toggle {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }

        .modo-toggle a {
            color: var(--azul-governo);
            text-decoration: none;
            font-weight: bold;
        }
        .modo-toggle a:hover { text-decoration: underline; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Passo Seguro</h1>
            <p>SESAPI / Hospital Getúlio Vargas - HGV</p>
        </div>

        <!-- ABAS DE SELEÇÃO DO PERFIL -->
        <div class="tabs-container">
            <button type="button" class="tab-btn ativo" id="tab-paciente" onclick="alternarPerfil('paciente')">Paciente</button>
            <button type="button" class="tab-btn" id="tab-profissional" onclick="alternarPerfil('profissional')">Profissional / HGV</button>
        </div>

        <form id="form-auth">
            <!-- Campos específicos para profissionais (visíveis apenas quando aba profissional estiver ativa e no modo cadastro) -->
            <div id="campos-profissional" class="hidden">
                <div class="form-group">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" class="form-control" placeholder="Ex: Dr. Carlos Eduardo">
                </div>
                <div class="form-group">
                    <label for="coren">Nº do COREN:</label>
                    <input type="text" id="coren" class="form-control" placeholder="Ex: COREN-PI 123456">
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail de Acesso:</label>
                <input type="email" id="email" class="form-control" required placeholder="seu.email@exemplo.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="form-control" required placeholder="********">
            </div>

            <button type="submit" id="btn-submit" class="btn-acao">Entrar</button>
        </form>

        <div class="modo-toggle">
            <span id="texto-alternancia">Não tem cadastro? <a href="#" id="link-alternar-modo">Cadastre-se como Paciente</a></span>
        </div>
    </div>

    <script>
        let perfilAtual = 'paciente'; // 'paciente' ou 'profissional'
        let modoCadastro = false;

        function alternarPerfil(perfil) {
            perfilAtual = perfil;
            if (perfil === 'paciente') {
                document.getElementById('tab-paciente').classList.add('ativo');
                document.getElementById('tab-profissional').classList.remove('ativo');
                document.getElementById('campos-profissional').classList.add('hidden');
            } else {
                document.getElementById('tab-profissional').classList.add('ativo');
                document.getElementById('tab-paciente').classList.remove('ativo');
                if (modoCadastro) {
                    document.getElementById('campos-profissional').classList.remove('hidden');
                }
            }
            atualizarTextoAlternancia();
        }

        const linkAlternar = document.getElementById('link-alternar-modo');
        linkAlternar.addEventListener('click', (e) => {
            e.preventDefault();
            modoCadastro = !modoCadastro;
            
            if (modoCadastro) {
                document.getElementById('btn-submit').textContent = 'Cadastrar';
                if (perfilAtual === 'profissional') {
                    document.getElementById('campos-profissional').classList.remove('hidden');
                }
            } else {
                document.getElementById('btn-submit').textContent = 'Entrar';
                document.getElementById('campos-profissional').classList.add('hidden');
            }
            atualizarTextoAlternancia();
        });

        function atualizarTextoAlternancia() {
            if (modoCadastro) {
                linkAlternar.textContent = 'Já possui conta? Faça login';
                document.querySelector('.modo-toggle').firstChild.textContent = 'Já tem cadastro? ';
            } else {
                linkAlternar.textContent = `Cadastre-se como ${perfilAtual === 'paciente' ? 'Paciente' : 'Profissional'}`;
                document.querySelector('.modo-toggle').firstChild.textContent = 'Não tem cadastro? ';
            }
        }

        // Lógica de Autenticação com Supabase
        document.getElementById('form-auth').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (typeof window.supabase === 'undefined') {
                alert("Erro: Cliente Supabase não inicializado.");
                return;
            }

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (modoCadastro) {
                // FLUXO DE CADASTRO
                const nomeCompleto = perfilAtual === 'profissional' ? document.getElementById('nome-completo').value.trim() : (email.split('@')[0]);
                const coren = perfilAtual === 'profissional' ? document.getElementById('coren').value.trim() : null;
                const aprovadoInicial = perfilAtual === 'paciente' ? true : false; // Profissionais nascem bloqueados

                if (perfilAtual === 'profissional' && (!nomeCompleto || !coren)) {
                    alert("Por favor, preencha o Nome Completo e o COREN.");
                    return;
                }

                // 1. Cadastra no Auth do Supabase
                const { data, error: errAuth } = await window.supabase.auth.signUp({
                    email: email,
                    password: senha,
                    options: {
                        data: {
                            nome: nomeCompleto,
                            tipo: perfilAtual
                        }
                    }
                });

                if (errAuth) {
                    alert("Erro no cadastro: " + errAuth.message);
                    return;
                }

                // 2. Insere os dados complementares na tabela perfis_usuarios
                if (data.user) {
                    const { error: errPerfil } = await window.supabase
                        .from('perfis_usuarios')
                        .insert([
                            {
                                id: data.user.id,
                                email: email,
                                nome_completo: nomeCompleto,
                                tipo: perfilAtual,
                                coren: coren,
                                aprovado: aprovadoInicial
                            }
                        ]);

                    if (errPerfil) {
                        console.error("Erro ao inserir perfil:", errPerfil.message);
                    }
                }

                if (perfilAtual === 'profissional') {
                    alert("Cadastro realizado com sucesso! Sua conta profissional aguarda liberação da moderação SESAPI/HGV para acesso.");
                } else {
                    alert("Cadastro realizado com sucesso! Redirecionando...");
                    window.location.href = "dashboard.html";
                }

                modoCadastro = false;
                document.getElementById('btn-submit').textContent = 'Entrar';
                document.getElementById('campos-profissional').classList.add('hidden');
                atualizarTextoAlternancia();
                document.getElementById('form-auth').reset();

            } else {
                // FLUXO DE LOGIN
                const { data, error: errLogin } = await window.supabase.auth.signInWithPassword({
                    email: email,
                    password: senha
                });

                if (errLogin) {
                    alert("Erro ao entrar: " + errLogin.message);
                    return;
                }

                // Verifica o perfil na tabela perfis_usuarios para checar aprovação de profissional
                const { data: perfil, error: errPerfil } = await window.supabase
                    .from('perfis_usuarios')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (errPerfil || !perfil) {
                    alert("Erro ao carregar dados do usuário.");
                    return;
                }

                // Validação de segurança institucional para profissionais
                if (perfil.tipo === 'profissional' && !perfil.aprovado) {
                    alert("Acesso pendente! Seu cadastro profissional aguarda liberação da moderação SESAPI/HGV.");
                    await window.supabase.auth.signOut();
                    return;
                }

                // Redireciona conforme o tipo de usuário
                if (perfil.tipo === 'profissional') {
                    window.location.href = "profissional.html";
                } else {
                    window.location.href = "dashboard.html";
                }
            }
        });
    </script>
</body>
</html>
